[package]
name = "fn0-object-storage"
version = "0.5.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "User-facing S3-compatible object storage for fn0/Forte apps (works in both WASI components and native binaries)"

[lib]
harness = false

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
forte-sdk = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
forte-sdk = { workspace = true, features = ["test-harness"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
