[package]
name = "fn0-doc-db"
version = "0.4.13"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Document-oriented Turso/libSQL DB (works in both WASI components and native binaries)"

# Dependents reach this crate as `doc_db` through the workspace alias, but that
# alias does not exist inside the crate's own `tests/`. Naming the lib target to
# match keeps one spelling everywhere.
[lib]
name = "doc_db"

[features]
dev-test = []

[[test]]
name = "integration_test"
harness = false

[[test]]
name = "memory_test"
harness = false

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
libsql-hrana = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
forte-sdk = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
forte-sdk = { workspace = true, features = ["test-harness"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["time"] }
