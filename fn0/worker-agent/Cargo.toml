[package]
name = "fn0-worker-agent"
version = "0.1.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-instance agent that supervises fn0-worker containers (lifecycle, blue-green, in-host proxy, DNS register)."

[dependencies]
anyhow = { workspace = true }
color-eyre = { workspace = true }
doc-db = { workspace = true }
fn0-shared-schema = { workspace = true }
forte-macros = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
