[package]
name = "fn0-control"
version = "0.1.3"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
cookie = "0.18"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
http = "1"
rcgen = { version = "=0.14.7", default-features = false, features = ["pem", "ring"] }
forte-json = { path = "../../../forte/json" }
forte-sdk = { path = "../../../forte/sdk" }
doc-db = { package = "fn0-doc-db", path = "../../../doc-db" }
fn0-shared-schema = { path = "../../shared-schema", version = "=0.2.6" }
futures = "0.3"
tracing = "=0.1.44"

[build-dependencies]
forte-codegen = { path = "../../../forte/codegen" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = "5"
two-face = "0.5"

# Deliberately its own workspace root, with its own lockfile: a forte app is
# built the way a user's app is, not with the fn0 workspace's feature
# unification. Without this, a git worktree nested under the repo makes cargo
# resolve the outer checkout's workspace instead.
[workspace]
