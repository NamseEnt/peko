[package]
name = "fn0-worker-proxy"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiny, rarely-changing TCP forwarder fronting fn0-worker containers on :443. Polls a target file the worker-agent writes, so agent restarts (and the proxy's own restarts) don't drop connections."

[dependencies]
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
