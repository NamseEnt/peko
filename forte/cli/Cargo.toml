[package]
name = "forte-cli"
version = "0.6.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the Forte fullstack web framework"

[[bin]]
name = "forte"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/release/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
fn0 = { workspace = true }
fn0-deploy = { workspace = true }
futures = { workspace = true }
fastwebsockets = { workspace = true, features = ["upgrade", "unstable-split"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "client"] }
hyper-util = { workspace = true, features = [
    "service",
    "client-legacy",
    "http1",
    "tokio",
] }
inquire = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
open = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
syn = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tempfile = { workspace = true }
